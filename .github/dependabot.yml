---
version: 2
# depapprove.yml auto-merges these pull requests, so a brand-new release would reach main with
# nobody having looked at it. The cooldown leaves a day for a compromised release to be yanked
updates:

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 1
      groups:
          github-actions:
              patterns:
                  - '*'

    - package-ecosystem: pre-commit
      directory: /
      schedule:
          interval: monthly
      cooldown:
          default-days: 1
      groups:
          lockfile:
              patterns:
                  - '*'

    - package-ecosystem: uv
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 1
      versioning-strategy: lockfile-only
      groups:
          lockfile:
              patterns:
                  - '*'

    - package-ecosystem: cargo
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 1
      versioning-strategy: lockfile-only
      groups:
          lockfile:
              patterns:
                  - '*'
