---
version: 2
# depapprove.yml merges these pull requests automatically, thus no person examines a new release
# before it reaches main. The cooldown gives the registry seven days to remove a release that an
# attacker changed
updates:

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          github-actions:
              patterns:
                  - '*'

    - package-ecosystem: pre-commit
      directory: /
      schedule:
          interval: monthly
      cooldown:
          default-days: 7
      groups:
          lockfile:
              patterns:
                  - '*'

    - package-ecosystem: uv
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      versioning-strategy: lockfile-only
      groups:
          lockfile:
              patterns:
                  - '*'

    - package-ecosystem: cargo
      directory: /rust
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      versioning-strategy: lockfile-only
      groups:
          lockfile:
              patterns:
                  - '*'
