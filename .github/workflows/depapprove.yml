---
name: Dependabot auto-merge
# this job checks out no code from the pull request, thus pull_request_target is safe here. The trigger
# lets the job read GH_TOKEN from the Actions secrets
on: pull_request_target
# the job merges with GH_TOKEN and not with the built-in token, thus the built-in token needs no permissions
permissions: {}
jobs:
    dependabot:
        timeout-minutes: 10
        runs-on: ubuntu-26.04-arm
        if: github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'pre-commit-ci[bot]'
        steps:
            - name: Enable auto-merge for Dependabot PRs
              run: gh pr merge --squash --auto "$PR_URL"
              env:
                  PR_URL: ${{github.event.pull_request.html_url}}
                  GH_TOKEN: ${{secrets.GH_TOKEN}}
