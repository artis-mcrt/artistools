---
name: Benchmark with CodSpeed
on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:
    repository_dispatch:
        types: [trigger_checks]
# a run takes up to three hours, so several pushes in a row would queue up runs that are already
# superseded. CodSpeed falls back to the nearest ancestor that does have results, so skipping the
# intermediate commits costs a data point rather than a comparison
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    codspeed-benchmarks:
        # a pull request from a fork cannot read CODSPEED_TOKEN, so the upload would fail. Dependabot
        # runs read the Dependabot secret store rather than the Actions one, so they cannot read it
        # either, even though the branch lives in this repository
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login
            != 'dependabot[bot]')
        timeout-minutes: 180
        # the valgrind of the CodSpeed simulation gives NaN and incorrect floats on arm64, and nine tests then fail
        runs-on: ubuntu-26.04
        permissions:
            contents: read # required for actions/checkout
            id-token: write # required for OIDC authentication with CodSpeed
        env:
            # pyo3 0.29 supports Python 3.15 at most. This setting permits a build for Python 3.16.
            PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
            UV_FROZEN: 1
        name: codspeed benchmarks
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: Setup uv
              id: setup-uv
              uses: astral-sh/setup-uv@v10.3.1
              with:
                  activate-environment: true
                  cache-suffix: codspeed
                  cache-dependency-glob: '**/uv.lock'

            - name: Update the rust toolchain
              run: rustup update stable

            - name: Cache cargo and rust build
              uses: Swatinem/rust-cache@v2.9.3
              with:
                  workspaces: rust
                  cache-on-failure: true
                  key: ${{ steps.setup-uv.outputs.python-version }}

            - name: Install artistools
              # valgrind of the CodSpeed simulation needs the debug info of libc for accurate results, and the
              # runner image does not have it
              run: |
                  sudo apt-get update
                  sudo apt-get install liblzma-dev libc6-dbg
                  uv sync --compile-bytecode

            - name: Download/extract test data
              working-directory: tests/data/
              run: source ./setuptestdata.sh

            - name: Run benchmarks
              uses: CodSpeedHQ/action@v5.5.0
              with:
                  mode: simulation
                  run: pytest --codspeed
