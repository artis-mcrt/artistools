---
name: Test and lint
permissions:
    contents: read
on:
    push:
    merge_group:
    schedule:
        - cron: 0 10 * * 2
    workflow_dispatch:
    repository_dispatch:
        types: [trigger_checks]
env:
    PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    RUFF_OUTPUT_FORMAT: github
    UV_FROZEN: 1
jobs:
    lint:
        timeout-minutes: 30
        name: Format, lint, and type check
        runs-on: ubuntu-26.04-arm
        steps:
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              id: setup-uv
              with:
                  activate-environment: true
                  cache-suffix: lint
                  cache-dependency-glob: '**/uv.lock'

            # the toolchain is updated before the cache step so that the key rust-cache derives
            # from `rustc -vV` describes the toolchain that actually builds the extension
            - name: Update the rust toolchain
              run: rustup update stable

            - name: Cache cargo and rust build
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: rust
                  cache-on-failure: true
                  key: ${{ steps.setup-uv.outputs.python-version }}

            - name: Install artistools[extras]
              run: uv sync --all-extras

            - name: Run Ruff
              if: always()
              run: |
                  uv run -- ruff --version
                  uv run -- ruff check --exit-non-zero-on-fix --no-fix

            - name: Run Ruff Format
              if: always()
              run: uv run -- ruff format --check --exit-non-zero-on-format

            - name: Run pyrefly
              if: always()
              run: uv run -- pyrefly check --output-format github

            # refurb runs mypy internally, which hits an internal error walking the pyvista
            # sources, so keep it to this project's own files
            - name: Run refurb
              if: always()
              run: uv run -- refurb artistools --quiet --format github -- --follow-imports=skip

            # informational only: vulture reports possibly-unused code at 60% confidence, which
            # includes false positives, so it must not gate the build
            - name: Run vulture (informational)
              if: always()
              continue-on-error: true
              run: uv run -- vulture

            - name: Run prek pre-commit checks
              if: always()
              uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

            - name: Run rust clippy
              if: always()
              working-directory: rust/
              run: |
                  rustup component add clippy
                  cargo clippy --all-features -- -D warnings -D clippy::pedantic

    pytest:
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.13', '3.14', 3.14t, '3.15', 3.15t]
        runs-on: ubuntu-26.04${{ !endsWith(matrix.python-version, 't') && '-arm' || '' }}
        name: pytest python ${{ matrix.python-version }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup uv
              id: setup-uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  activate-environment: true
                  python-version: ${{ matrix.python-version }}
                  cache-dependency-glob: '**/uv.lock'

            - name: Update the rust toolchain
              run: rustup update stable

            - name: Cache cargo and rust build
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: rust
                  cache-on-failure: true
                  key: ${{ steps.setup-uv.outputs.python-version }}

            - name: Install artistools (no dev deps)
              run: uv sync --no-dev --compile-bytecode

            - name: Check artistools command line tool
              run: |
                  artistools --help
                  artistools completions

            - name: Download/extract test data
              working-directory: tests/data/
              run: source ./setuptestdata.sh

            - name: Install dev deps
              run: uv sync --compile-bytecode

            - name: Test with pytest
              run: uv run --no-sync -- python -m pytest --cov --cov-report=xml

            - name: Report coverage
              run: uv run -- python -m coverage report

            - name: Upload coverage artifact
              if: matrix.python-version == '3.14' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage-report-python
                  path: coverage.xml

    upload-coverage-python:
        timeout-minutes: 10
        needs: pytest
        if: ${{ !cancelled() && needs.pytest.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
            == github.repository) }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            code-quality: write
            pull-requests: read
        steps:
            - name: Download coverage artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: coverage-report-python
            - name: Check for a pull request associated with this commit
              id: haspr
              if: github.ref != 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: echo "found=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq 'length > 0')" >> "$GITHUB_OUTPUT"

            - uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
              if: github.ref == 'refs/heads/main' || steps.haspr.outputs.found == 'true'
              with:
                  file: coverage.xml
                  language: Python
                  label: code-coverage-agent
                  # the upload succeeds and the report still lands, but waiting for the processing
                  # id has been failing server-side, and coverage reporting should not gate a build
                  fail-on-error: false
