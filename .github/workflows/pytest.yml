---
name: Test and lint
permissions:
    contents: read
on:
    push:
    merge_group:
    schedule:
        - cron: 0 10 * * 2
    workflow_dispatch:
    repository_dispatch:
        types: [trigger_checks]
# a new push to a branch makes the run of the previous commit obsolete. A group also cancels a run that
# waits for it, thus each run on main has its own group, and each commit on main has a test result
concurrency:
    group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
    cancel-in-progress: true
env:
    # pyo3 0.29 supports Python 3.15 at most. This setting permits a build for Python 3.16.
    PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    RUFF_OUTPUT_FORMAT: github
    UV_FROZEN: 1
jobs:
    lint:
        timeout-minutes: 30
        name: Format, lint, and type check
        runs-on: ubuntu-26.04-arm
        steps:
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              id: setup-uv
              with:
                  activate-environment: true
                  cache-suffix: lint
                  cache-dependency-glob: '**/uv.lock'

            # the toolchain is updated before the cache step so that the key rust-cache derives
            # from `rustc -vV` describes the toolchain that actually builds the extension
            - name: Update the rust toolchain
              run: rustup update stable

            - name: Cache cargo and rust build
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: rust
                  cache-on-failure: true
                  key: ${{ steps.setup-uv.outputs.python-version }}

            # UV_FROZEN makes every `uv sync` keep uv.lock unchanged, thus the uv-lock prek hook
            # reports nothing. This step fails when uv.lock is different from pyproject.toml
            - name: Check that uv.lock matches pyproject.toml
              run: uv lock --check

            - name: Install artistools[extras]
              run: uv sync --all-extras

            - name: Run Ruff
              if: always()
              run: |
                  uv run -- ruff --version
                  uv run -- ruff check --exit-non-zero-on-fix --no-fix

            - name: Run Ruff Format
              if: always()
              run: uv run -- ruff format --check --exit-non-zero-on-format

            - name: Run pyrefly
              if: always()
              run: uv run -- pyrefly check --output-format github

            # informational only: vulture reports possibly-unused code at 60% confidence, which
            # includes false positives, so it must not gate the build
            - name: Run vulture (informational)
              if: always()
              continue-on-error: true
              run: uv run -- vulture

            # the Ruff steps above run the version in uv.lock, and --no-fix makes them report each error.
            # The hooks correct the errors and show only the files that they change, thus this step skips them
            - name: Run prek pre-commit checks
              if: always()
              uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
              env:
                  SKIP: ruff-check,ruff-format

            - name: Run rust format check
              if: always()
              working-directory: rust/
              run: |
                  rustup component add rustfmt
                  cargo fmt --check

            - name: Run rust clippy
              if: always()
              working-directory: rust/
              run: |
                  rustup component add clippy
                  cargo clippy --all-features -- -D warnings

    pytest:
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.13', '3.14', '3.15', 3.15t]
                # one entry installs the optional packages, thus the pyvista and the plotly paths run.
                # Every entry would take minutes more for the same coverage
                include:
                    - python-version: '3.14'
                      syncextras: --all-extras
        runs-on: ubuntu-26.04-arm
        name: pytest python ${{ matrix.python-version }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup uv
              id: setup-uv
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  activate-environment: true
                  python-version: ${{ matrix.python-version }}
                  cache-dependency-glob: '**/uv.lock'

            - name: Update the rust toolchain
              run: rustup update stable

            - name: Cache cargo and rust build
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: rust
                  cache-on-failure: true
                  key: ${{ steps.setup-uv.outputs.python-version }}

            - name: Install artistools (no dev deps)
              run: uv sync --no-dev --compile-bytecode

            - name: Check artistools command line tool
              run: |
                  artistools --help
                  artistools completions bash
                  artistools completions zsh

            - name: Download/extract test data
              working-directory: tests/data/
              run: source ./setuptestdata.sh

            - name: Install dev deps
              run: uv sync --compile-bytecode ${{ matrix.syncextras }}

            - name: Test with pytest
              run: uv run --no-sync -- python -m pytest --cov --cov-report=xml

            - name: Report coverage
              run: uv run -- python -m coverage report

            - name: Upload coverage artifact
              if: matrix.python-version == '3.14' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage-report-python
                  path: coverage.xml

    upload-coverage-python:
        timeout-minutes: 10
        needs: pytest
        if: ${{ !cancelled() && needs.pytest.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
            == github.repository) }}
        runs-on: ubuntu-26.04-arm
        permissions:
            contents: read
            code-quality: write
            pull-requests: read
        steps:
            - name: Download coverage artifact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: coverage-report-python
            - name: Check for a pull request associated with this commit
              id: haspr
              if: github.ref != 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: echo "found=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq 'length > 0')" >> "$GITHUB_OUTPUT"

            - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
              if: github.ref == 'refs/heads/main' || steps.haspr.outputs.found == 'true'
              with:
                  file: coverage.xml
                  language: Python
                  label: code-coverage-agent
                  # the upload succeeds and the report still lands, but waiting for the processing
                  # id has been failing server-side, and coverage reporting should not gate a build
                  fail-on-error: false
