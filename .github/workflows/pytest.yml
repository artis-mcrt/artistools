---
name: Test and lint
permissions:
    contents: read
on:
    push:
    merge_group:
    schedule:
        - cron: 0 10 * * 2
    workflow_dispatch:
    repository_dispatch:
        types: [trigger_checks]
env:
    PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    RUFF_OUTPUT_FORMAT: github
    UV_FROZEN: 1
jobs:
    lint:
        timeout-minutes: 30
        name: Format, lint, and type check
        runs-on: ubuntu-26.04-arm
        steps:
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              id: setup-uv
              with:
                  activate-environment: true
                  cache-suffix: lint
                  cache-dependency-glob: '**/uv.lock'

            - name: Cache cargo and rust build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      rust/target/
                  key: lint-cargo-rust-target-${{ runner.os }}${{ runner.arch }}-python${{ steps.setup-uv.outputs.python-version }}-${{ hashFiles('**/Cargo.lock')
                      }}-${{ github.run_id }}
                  restore-keys: |
                      lint-cargo-rust-target-${{ runner.os }}${{ runner.arch }}-python${{ steps.setup-uv.outputs.python-version }}-${{ hashFiles('**/Cargo.lock') }}-
                      lint-cargo-rust-target-${{ runner.os }}${{ runner.arch }}-python${{ steps.setup-uv.outputs.python-version }}-
                      lint-cargo-rust-target-${{ runner.os }}${{ runner.arch }}-
                      cargo-rust-target-${{ runner.os }}${{ runner.arch }}-

            - name: Install artistools[extras]
              run: |
                  rustup update stable
                  uv sync --all-extras

            - name: Run Ruff
              if: always()
              run: |
                  uv run -- ruff --version
                  uv run -- ruff check --exit-non-zero-on-fix --no-fix

            - name: Run Ruff Format
              if: always()
              run: uv run -- ruff format --check --exit-non-zero-on-format

            - name: Run pyrefly
              if: always()
              run: uv run -- pyrefly check --output-format github

            - name: Run mypy
              if: always()
              run: uv run -- mypy

            # refurb runs mypy internally, which hits an internal error walking the pyvista
            # sources, so keep it to this project's own files
            - name: Run refurb
              if: always()
              run: uv run -- refurb artistools --quiet --format github -- --follow-imports=skip

            # informational only: vulture reports possibly-unused code at 60% confidence, which
            # includes false positives, so it must not gate the build
            - name: Run vulture (informational)
              if: always()
              continue-on-error: true
              run: uv run -- vulture

            - name: Run prek pre-commit checks
              if: always()
              uses: j178/prek-action@6dd76cd3f10a318f0fb0b7743a9651fda964a551 # v2

            - name: Run rust clippy
              if: always()
              working-directory: rust/
              run: |
                  rustup component add clippy
                  cargo clippy --all-features -- -D warnings -D clippy::pedantic

    pytest:
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.13', '3.14', 3.14t, '3.15', 3.15t]
        runs-on: ubuntu-26.04${{ !endsWith(matrix.python-version, 't') && '-arm' || '' }}
        name: pytest python ${{ matrix.python-version }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              id: setup-uv
              with:
                  activate-environment: true
                  python-version: ${{ matrix.python-version }}
                  cache-dependency-glob: '**/uv.lock'

            - name: Cache cargo and rust build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      rust/target/
                  key: cargo-rust-target-${{ runner.os }}${{ runner.arch }}-python${{ steps.setup-uv.outputs.python-version }}-${{ hashFiles('**/Cargo.lock')
                      }}-${{ github.run_id }}
                  restore-keys: |
                      cargo-rust-target-${{ runner.os }}${{ runner.arch }}-python${{ steps.setup-uv.outputs.python-version }}-${{ hashFiles('**/Cargo.lock') }}-
                      cargo-rust-target-${{ runner.os }}${{ runner.arch }}-python${{ steps.setup-uv.outputs.python-version }}-
                      cargo-rust-target-${{ runner.os }}${{ runner.arch }}-

            - name: Install artistools (no dev deps)
              run: |
                  rustup update stable
                  uv sync --no-dev --compile-bytecode

            - name: Check artistools command line tool
              run: |
                  artistools --help
                  artistools completions

            - name: Download/extract test data
              working-directory: tests/data/
              run: source ./setuptestdata.sh

            - name: Install dev deps
              run: uv sync --compile-bytecode

            - name: Test with pytest
              run: uv run --no-sync -- python -m pytest --cov --cov-report=xml

            - name: Report coverage
              run: uv run -- python -m coverage report

            - name: Upload coverage artifact
              if: matrix.python-version == '3.14' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage-report-python
                  path: coverage.xml

    upload-coverage-python:
        timeout-minutes: 10
        needs: pytest
        if: ${{ !cancelled() && needs.pytest.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
            == github.repository) }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            code-quality: write
            pull-requests: read
        steps:
            - name: Download coverage artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: coverage-report-python
            - name: Check for a pull request associated with this commit
              id: haspr
              if: github.ref != 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: echo "found=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq 'length > 0')" >> "$GITHUB_OUTPUT"

            - uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1.4.1
              if: github.ref == 'refs/heads/main' || steps.haspr.outputs.found == 'true'
              with:
                  file: coverage.xml
                  language: Python
                  label: code-coverage-agent
