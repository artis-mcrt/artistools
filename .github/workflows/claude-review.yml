---
name: Claude code review
permissions:
    contents: read
# "Test and lint" runs on push only. A pull_request trigger there would run the full test matrix a
# second time for each commit on a pull request branch, thus the review has its own workflow
on:
    pull_request:
        types: [opened, synchronize, ready_for_review, reopened]
# a new push makes the review of the previous commit obsolete
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true
jobs:
    review:
        timeout-minutes: 30
        # a pull request from a fork cannot read the Actions secrets. A Dependabot pull request gets no
        # review, even when a person reopens it. A draft is not ready for a review, and ready_for_review
        # starts the review when the author marks it
        if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login
            != 'dependabot[bot]' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            id-token: write
        steps:
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1
                  persist-credentials: false

            # a marketplace URL gives the default branch of the plugin on each run. Thus the job reads
            # the plugin from a fixed commit
            - name: Checkout the code-review plugin
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: anthropics/claude-code
                  ref: 2301018b1f61073c501a8e7a4813ef48c239163b # main on 2026-10-09
                  path: .claude-code-pinned
                  sparse-checkout: |
                      .claude-plugin
                      plugins/code-review
                  persist-credentials: false

            # Claude Code reserves the name claude-code-plugins for a marketplace on GitHub. Thus the
            # local marketplace gets a different name, and it lists only the code-review plugin
            - name: Rename the local marketplace
              working-directory: .claude-code-pinned/.claude-plugin
              run: |
                  jq '{name: "claude-code-pinned", owner, plugins: [.plugins[] | select(.name == "code-review")]}' \
                      marketplace.json > marketplace.json.new
                  mv marketplace.json.new marketplace.json

            - name: Review the pull request with Claude
              uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  plugin_marketplaces: ${{ github.workspace }}/.claude-code-pinned
                  plugins: code-review@claude-code-pinned
                  prompt: /code-review:code-review --comment ${{ github.event.pull_request.html_url }}
                  # the same tools as the allowed-tools list of the plugin command
                  claude_args: |
                      --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
