---
name: Claude code review
permissions:
    contents: read
# "Test and lint" runs on push only. A pull_request trigger there would run the full test matrix a
# second time for each commit on a pull request branch, thus the review has its own workflow
on:
    pull_request:
        types: [opened, synchronize, ready_for_review, reopened]
    # a comment that starts with "@claude review" starts a new full review, e.g. after a force push
    issue_comment:
        types: [created]
jobs:
    review:
        timeout-minutes: 60
        # a pull request from a fork cannot read the Actions secrets. A Dependabot pull request gets no
        # review, even when a person reopens it. A draft is not ready for a review, and ready_for_review
        # starts the review when the author marks it. The action also stops if the commenter cannot write
        if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.user.login != 'dependabot[bot]') || (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
            startsWith(github.event.comment.body, '@claude review') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
            }}
        # a new push makes the review of the previous commit obsolete. The concurrency is on the job, because a
        # skipped run of each other comment on the pull request would otherwise cancel the review
        concurrency:
            group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
            cancel-in-progress: true
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            id-token: write
        env:
            # the first review and a review on request use the maximum effort. A review after a new push
            # (synchronize) uses the medium effort, which reports only the findings that it is most sure of
            REVIEWEFFORT: ${{ github.event.action == 'synchronize' && 'medium' || 'max' }}
            PRURL: ${{ github.event.pull_request.html_url || github.event.issue.html_url }}
        steps:
            # an issue_comment event checks out the default branch, thus the ref names the head of the pull request
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
                  # the review reads the history with git log, git show, and git blame
                  fetch-depth: 0
                  persist-credentials: false

            - name: Review the pull request with Claude
              uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  prompt: /code-review ${{ env.REVIEWEFFORT }} --comment ${{ env.PRURL }}
                  # the built-in review needs Agent for its finder agents and its verifiers. Without that tool, it
                  # does one pass alone. It posts with gh api if the inline comment tool is not available.
                  # gh pr checks and gh run view show the results of CI. WebFetch and WebSearch read the documentation
                  # of a library. The review gets no tool that runs the code of the pull request
                  claude_args: |
                      --model claude-opus-5-5
                      --allowedTools "Agent,Read,Grep,Glob,WebFetch,WebSearch,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(gh pr checks:*),Bash(gh run view:*),mcp__github_inline_comment__create_inline_comment,Bash(gh api:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
