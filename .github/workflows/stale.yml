---
name: Stale
on:
    schedule:
        - cron: 0 8 * * *
permissions:
    issues: write
    pull-requests: write
jobs:
    stale:
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
              with:
                  days-before-stale: 183
                  days-before-close: 90
