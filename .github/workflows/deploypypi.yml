---
name: Build and deploy to PyPI/testPyPI
permissions:
    contents: read
on:
    push:
        paths:
            - .github/workflows/deploypypi.yml
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            deploy-to-pypi:
                description: Do real deployment to PyPI (not TestPyPI)
                required: true
                default: 'false'
env:
    MACOSX_DEPLOYMENT_TARGET: 13.0
    PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    UV_FROZEN: 1

jobs:
    build_wheels:
        timeout-minutes: 90
        name: Build python3${{ matrix.freethreading }} ${{ matrix.target.os_arch }}
        strategy:
            matrix:
                target: [{os_arch: manylinux_x86_64, runs-on: ubuntu-26.04}, {os_arch: manylinux_aarch64, runs-on: ubuntu-26.04-arm}, {os_arch: macosx_arm64,
                          runs-on: macos-26}]
                freethreading: [t, '']
            fail-fast: false
        runs-on: ${{ matrix.target.runs-on }}
        env:
            CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ARTISTOOLS
            CIBW_BUILD: cp3??${{ matrix.freethreading }}-${{ matrix.target.os_arch }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  enable-cache: false

            - name: Build wheels
              uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
              with:
                  output-dir: wheelhouse

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: cibw-wheels-${{ matrix.target.os_arch }}-${{ strategy.job-index }}
                  path: ./wheelhouse/*.whl

    build_sdist:
        timeout-minutes: 15
        name: Build source distribution
        runs-on: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  enable-cache: false

            - name: Build sdist
              run: uv build --sdist

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: cibw-sdist
                  path: dist/*.tar.gz

    testdeploy:
        timeout-minutes: 15
        name: Test upload to TestPyPI
        needs: [build_wheels, build_sdist]
        runs-on: ubuntu-26.04
        environment:
            name: test
            url: https://test.pypi.org/project/artistools/
        permissions:
            id-token: write
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: cibw-*
                  path: dist
                  merge-multiple: true

            - name: Publish package to TestPyPI
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
              with:
                  skip-existing: true
                  verbose: true
                  repository-url: https://test.pypi.org/legacy/

    deploy:
        timeout-minutes: 15
        name: Upload to PyPI
        needs: [build_wheels, build_sdist]
        runs-on: ubuntu-24.04
        environment:
            name: release
            url: https://pypi.org/project/artistools/
        permissions:
            id-token: write
        if: github.event.inputs.deploy-to-pypi == 'true' || github.event_name == 'release'
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: cibw-*
                  path: dist
                  merge-multiple: true

            - name: Publish package to PyPI
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
              with:
                  skip-existing: true
                  verbose: false
