---
name: Build and deploy to PyPI/testPyPI
permissions:
    contents: read
on:
    push:
        branches: [main]
        paths:
            - .github/workflows/deploypypi.yml
    pull_request:
        paths:
            - .github/workflows/deploypypi.yml
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            deploy-to-pypi:
                description: Do real deployment to PyPI (not TestPyPI)
                required: true
                default: 'false'
env:
    MACOSX_DEPLOYMENT_TARGET: 14.0
    # pyo3 0.29 supports Python 3.15 at most. This setting permits a build for Python 3.16.
    PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    UV_FROZEN: 1

jobs:
    build_wheels:
        timeout-minutes: 90
        name: Build python3${{ matrix.freethreading }} ${{ matrix.target.os_arch }}
        strategy:
            matrix:
                target: [{os_arch: manylinux_x86_64, runs-on: ubuntu-26.04}, {os_arch: manylinux_aarch64, runs-on: ubuntu-26.04-arm}, {os_arch: macosx_arm64,
                          runs-on: macos-26}]
                freethreading: [t, '']
                # the free-threaded build needs Python 3.15 or later, because Python 3.14t has no stable
                # application binary interface (ABI)
                include:
                    - freethreading: t
                      cibwbuild: cp315t
                    - freethreading: ''
                      cibwbuild: cp3??
            fail-fast: false
        runs-on: ${{ matrix.target.runs-on }}
        env:
            CIBW_BUILD: ${{ matrix.cibwbuild }}-${{ matrix.target.os_arch }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
              with:
                  enable-cache: false

            - name: Build wheels
              uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
              with:
                  output-dir: wheelhouse

            # test-skip in pyproject.toml excludes the free-threaded wheels from the cibuildwheel
            # test, because that test installs the dependencies, and polars has no free-threaded
            # wheel. This step checks those wheels on the host. It installs each wheel without its
            # dependencies, which is all that check_wheel.py needs. A wheel of the free-threaded
            # stable ABI (abi3t) has the Python version in its python tag, and it serves both builds
            # of that version, thus the step checks it on both
            - name: Check the free-threaded wheels
              if: matrix.freethreading == 't'
              run: |
                  for wheel in wheelhouse/*.whl; do
                      pytag=$(basename "${wheel}" | cut -d- -f3)
                      abitag=$(basename "${wheel}" | cut -d- -f4)
                      case "${abitag}" in
                          *abi3t*) ;;
                          *)
                              echo "Expected a wheel of the free-threaded stable ABI (abi3t), but found ${wheel}"
                              exit 1
                              ;;
                      esac
                      pyver=$(echo "${pytag}" | sed -E 's/^cp3([0-9]+)$/3.\1/')
                      for python in "${pyver}t" "${pyver}"; do
                          venv="${RUNNER_TEMP}/checkvenv-$(basename "${wheel}" .whl)-${python}"
                          uv venv --python "${python}" "${venv}"
                          uv pip install --python "${venv}/bin/python" --no-deps "${wheel}"
                          "${venv}/bin/python" check_wheel.py
                      done
                  done

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: cibw-wheels-${{ matrix.target.os_arch }}-${{ strategy.job-index }}
                  path: ./wheelhouse/*.whl

    build_sdist:
        timeout-minutes: 15
        name: Build source distribution
        runs-on: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
              with:
                  enable-cache: false

            - name: Build sdist
              run: uv build --sdist

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: cibw-sdist
                  path: dist/*.tar.gz

    testdeploy:
        timeout-minutes: 15
        name: Test upload to TestPyPI
        needs: [build_wheels, build_sdist]
        # pypa/gh-action-pypi-publish runs a container image that exists for x86_64 alone
        runs-on: ubuntu-26.04
        environment:
            name: test
            url: https://test.pypi.org/project/artistools/
        permissions:
            id-token: write
        # a pull request from a fork gets no id-token permission, thus it can build the wheels
        # but it cannot upload them
        if: github.event.pull_request.head.repo.fork != true
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: cibw-*
                  path: dist
                  merge-multiple: true

            - name: Publish package to TestPyPI
              uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
              with:
                  skip-existing: true
                  verbose: true
                  repository-url: https://test.pypi.org/legacy/

    deploy:
        timeout-minutes: 15
        name: Upload to PyPI
        needs: [build_wheels, build_sdist]
        # pypa/gh-action-pypi-publish runs a container image that exists for x86_64 alone
        runs-on: ubuntu-26.04
        environment:
            name: release
            url: https://pypi.org/project/artistools/
        permissions:
            id-token: write
        if: >-
            github.event.inputs.deploy-to-pypi == 'true'
            || (github.event_name == 'release' && !github.event.release.prerelease)
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: cibw-*
                  path: dist
                  merge-multiple: true

            - name: Publish package to PyPI
              uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
              with:
                  # a second run for one version can happen, e.g. two dispatches of this workflow.
                  # The upload of a file that PyPI already has is then not an error
                  skip-existing: true
                  verbose: false
