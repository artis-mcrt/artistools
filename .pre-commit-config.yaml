---
default_install_hook_types:
    - pre-commit
    - post-checkout
    - post-merge
    - post-rewrite
fail_fast: false
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
            args: [--maxkb=800]
          - id: check-ast
          - id: check-case-conflict
          - id: check-builtin-literals
          - id: check-docstring-first
          - id: check-executables-have-shebangs
          - id: check-json
          - id: pretty-format-json
            args: [--autofix]
          - id: check-merge-conflict
          - id: check-symlinks
          - id: check-toml
          - id: check-yaml
          - id: detect-private-key
          - id: destroyed-symlinks
          - id: end-of-file-fixer
          - id: fix-byte-order-marker
          - id: forbid-new-submodules
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: name-tests-test
            args: [--pytest-test-first]
          - id: trailing-whitespace

    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.2.3
      hooks:
          - id: yamlfmt

    - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
      rev: v1.7.12.24
      hooks:
          - id: actionlint
            # this actionlint predates the ubuntu-26.04 images and the code-quality permission
            # scope, and reports both as unknown. Drop these once it has caught up
            args:
                - -ignore=label "ubuntu-26\.04(-arm)?" is unknown
                - -ignore=unknown permission scope "code-quality"

    - repo: https://github.com/zizmorcore/zizmor-pre-commit
      rev: v1.29.0
      hooks:
          - id: zizmor
            # the audits that resolve refs against the GitHub API need a token that a local run
            # has no reason to have, and every action here is pinned to a hash anyway
            args: [--no-progress, --offline]

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.2
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.12.3
      hooks:
          - id: uv-lock
          - id: uv-sync
            args: [--frozen, --all-extras, --no-install-project]

    - repo: https://github.com/astral-sh/ty-pre-commit
      rev: v0.0.69
      hooks:
          - id: ty
            name: ty
            args: [--all-extras]

ci:
    skip: [ty]
    autoupdate_schedule: quarterly
