[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "artistools"
authors = [
    { name = "Luke J. Shingles", email = "luke.shingles@gmail.com" },
    { name = "Christine E. Collins", email = "c.collins@gsi.de" },
    { name = "Alexander Holas", email = "alexander.holas@h-its.org" },
    { name = "Fionntan Callan", email = "fcallan02@qub.ac.uk" },
    { name = "Stuart Sim", email = "s.sim@qub.ac.uk" },
    { name = "Joshua Pollin", email = "jpollin02@qub.ac.uk" },
    { name = "Gerrit Leck", email = "g.leck@gsi.de" },
]
description = "Plotting and analysis tools for the ARTIS 3D radiative transfer code for supernovae and kilonovae."
keywords = [
    "artis",
    "astronomy",
    "astrophysics",
    "kilonova",
    "monte-carlo",
    "radiative-transfer",
    "supernova",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
version = "2026.10.18"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICEN[CS]E*"]
readme = { file = "README.md", content-type = 'text/markdown' }
dependencies = [
    "argcomplete>=3.7.2",
    "extinction>=0.4.9",
    "matplotlib>=3.11",
    "numpy>=2.5.2",
    "polars>=2.0.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tqdm>=4.70.0",
    "zstandard>=0.25.0;python_version<'3.14'",
]

[project.optional-dependencies]
# a package that the code imports with an import statement also needs an entry in `ignore-missing-imports` under
# [tool.pyrefly]. A package that `import_optional` loads needs no entry
extras = [
    "george>=0.4.4;python_version<'3.15'", # not compatible with 3.15 yet
    "imageio>=2.37.4",
    "plotly>=6.9.0",
    "pypdf>=6.16.2",
    "pynonthermal>=2026.9.30",
    # the viewers of --interactive use AppKit to copy a PDF or an SVG file to the clipboard of macOS. Qt gives such
    # a file a type that no other application reads
    "pyobjc-framework-cocoa>=12.2.2;sys_platform=='darwin' and python_version<'3.15'",
    # plotspectra --interactive needs this package, which has no wheels for Python 3.15. Its wheels use the stable
    # application binary interface (ABI), and a free-threaded build cannot load them. CI installs the extras only on
    # the build of Python 3.14 that is not free-threaded
    "pyside6-essentials>=6.11.2;python_version<'3.15'",
    "pyvista>=0.48.4;python_version<'3.15'", # not compatible with 3.15 yet
]

[dependency-groups]
dev = [
    "imageio>=2.38.1",
    "prek>=0.5.5",
    "pynonthermal>=2026.9.30",
    "pypdf>=6.21",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "pytest-codspeed>=5.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist[psutil]>=3.8.0",
    "ruff>=0.17.0,<0.18",
    "ty>=0.0.89",
    "types-pyyaml>=6.0.12.20260408",
    "types-tqdm>=4.67.3.20260408",
    "vulture>=2.16",
]

[project.urls]
Repository = "https://github.com/artis-mcrt/artistools"
Issues = "https://github.com/artis-mcrt/artistools/issues"

# Every script runs the same dispatcher. The name that starts it gives the subcommand, which
# get_script_subcommands reads from subcommandtree. Name a new script in that tree as well as here,
# because test_console_scripts holds the two lists to each other.
[project.scripts]
at = 'artistools.__main__:main'
artistools = 'artistools.__main__:main'
plotartisestimators = 'artistools.__main__:main'
plotartislightcurve = 'artistools.__main__:main'
plotartisspectrum = 'artistools.__main__:main'

[tool.cibuildwheel]
build-frontend = "uv"
archs = ["auto64"]
# check_wheel.py gives the reason why this is not a full run of the command-line interface
test-command = "python {project}/check_wheel.py"
# cibuildwheel installs the wheel together with its dependencies, and polars has no free-threaded
# wheel. The test install thus compiles polars from source, and the compiler runs out of memory on
# the aarch64 runner. deploypypi.yml checks the free-threaded wheels on the host instead, with an
# install that skips the dependencies
test-skip = "cp3*t-*"

[tool.cibuildwheel.linux]
before-all = ["curl -sSf https://sh.rustup.rs | sh -s -- -y"]
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
before-all = [
    "rustup update stable",
]

# abi3audit 0.0.26 is from before Python 3.15. It does not know PyModExport_<name>, the module export
# hook of PEP 793 that each abi3t extension defines, and on Linux it reports that symbol as a
# violation. The abi3 wheel keeps its audit on each platform, and the abi3t wheel keeps it on macOS.
# Remove this override when abi3audit knows the hook
[[tool.cibuildwheel.overrides]]
select = "cp315t-manylinux_*"
audit-command = ""

[tool.coverage.run]
# --cov=./ also measured conftest.py, set_version.py and tests/__init__.py. Test modules are
# ~100% covered by definition, so counting them inflated the project figure; dropping them is a
# one-off baseline reset of about 4.5 points, not a regression.
source = ["artistools"]
omit = ["*/test_*.py", "*/conftest.py"]
branch = true

[tool.uv]
required-version = ">=0.12.9"
# uv tracks only pyproject.toml by default, thus a change in the Rust crate installed a cached build of the extension
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/Cargo.toml" },
    { file = "rust/Cargo.lock" },
    { file = "rust/src/**/*.rs" },
]

[tool.maturin]
bindings = "pyo3"
profile = "release"
manifest-path = "rust/Cargo.toml"
module-name = "artistools.rustext"
use-base-python = true
include = [
    "artistools/data/**",
    "artistools/**/matplotlibrc",
]
exclude = [
    { path = "**/test_*.py", format = "wheel" },
    { path = "set_version.py", format = "sdist" },
    { path = "check_wheel.py", format = "sdist" },
]

[tool.pyrefly]
preset = "strict"
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/venv/**",
    "**/.[!/.]*/**",
    '**/build/**',
    '**/dist/**',
    '**/target/**',
    '**/.venv/**',
]
python-interpreter-path = ".venv/bin/python3"
# missing-import is left enabled so a renamed or mistyped first-party module is an error (no other
# checker catches that: pyright downgrades it to information).
# The [project.optional-dependencies] packages are absent from a plain `uv sync`, and zstandard is
# not installed on 3.14+, so those resolve to Any rather than erroring.
ignore-missing-imports = [
    "george",
    "george.*",
    "pypdf",
    "PySide6",
    "PySide6.*",
    "shiboken6",
    "zstandard",
]

[tool.pyrefly.errors]
unbound-name = false
# the strict preset leaves these kinds off
empty-body = true
implicit-abstract-class = true
implicit-import = true
implicit-reexport = true
implicitly-defined-attribute = true
incompatible-comparison = true
invalid-abstract-method = true
invalid-cast = true
missing-super-call = true
no-any-return-explicit = true
no-any-return-implicit = true
non-exhaustive-match-open-type = true
not-required-key-access = true
protocol-implicitly-defined-attribute = true
string-as-iterable = true
unannotated-protocol-member = true
unannotated-return = true
unimported-directive = true
uninitialized-instance-variable = true
unknown-attribute-type = true
unknown-return-type = true
unsupported-dynamic-base = true
unsupported-operation = true
untyped-class-decorator = true
untyped-function-decorator = true
untyped-namedtuple = true
unused-type-ignore = true
# these kinds are warnings by default, and a warning does not stop CI
assert-type-unspellable-subtype = "error"
attribute-assign-on-never = "error"
deprecated = "error"
division-by-zero = "error"
invalid-decorator = "error"
misplaced-ignore = "error"
missing-attribute-patch-target = "error"
name-mismatch = "error"
non-convergent-recursion = "error"
non-exhaustive-match = "error"
redundant-cast = "error"
redundant-condition = "error"
unnecessary-type-conversion = "error"
unreachable = "error"
unreachable-match-case = "error"
unresolvable-dunder-all = "error"
useless-overload-body = "error"
variance-mismatch = "error"

[tool.pyright]
venvPath = "."
venv = ".venv"
enableTypeIgnoreComments = false # leave these for the other type checkers to interpret
exclude = [
    '**/node_modules',
    '**/__pycache__',
    '**/.*',
    'build',
    'dist',
    'target',
    '.venv',
]
reportAny = false
reportCallInDefaultInitializer = "error"
reportConstantRedefinition = false # uppercase physics variables (Z, W, T_R) are reassignable by convention
reportExplicitAny = false
reportImplicitOverride = "error"
reportImplicitStringConcatenation = false
reportImportCycles = false
reportMatchNotExhaustive = "error"
reportMissingImports = "information"
reportMissingTypeStubs = false
reportPossiblyUnboundVariable = false
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnnecessaryComparison = "information"
reportUnreachable = false
reportUnusedCallResult = false
reportUnusedParameter = false
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
pythonVersion = "3.13"

[tool.pytest]
minversion = "9.0"
addopts = [
    "--durations=0",
    "--durations-min=1.0",
    "-n",
    "auto",
]
testpaths = ["artistools"]
strict = true

[tool.ruff]
line-length = 120
fix = true
preview = true

[tool.ruff.format]
skip-magic-trailing-comma = true
preview = true
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
# ALL does not select a rule that has no code
extend-select = ["pytest-fixture-autouse"]
ignore = [
    "any-type",
    "complex-structure",
    "missing-trailing-comma",
    "missing-copyright-notice",
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "docstring-missing-returns",
    "docstring-missing-yields",
    "docstring-missing-exception",
    "commented-out-code",
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "invalid-function-name",
    "invalid-argument-name",
    "non-lowercase-variable-in-function",
    "import-outside-top-level",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-nested-blocks",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-arguments",
    "too-many-statements",
    "magic-value-comparison",
    "float-equality-comparison",
    "assert",
    "print",
]
unfixable = [
    "commented-out-code", # (will just delete it!)
    "unused-import",      # (can be annoying to have import disappear while editing)
    "unused-variable",
    "expr-or-true",
    "expr-and-false",
]

[tool.ruff.lint.per-file-ignores]
# Test names describe the case already; a docstring restating them is noise. A test can write compressed
# files and start processes, because it tests the readers of such files and the work in several processes
"**/test_*.py" = [
    "undocumented-public-module",
    "undocumented-public-class",
    "undocumented-public-function",
    "banned-api",
]
"**/conftest.py" = ["undocumented-public-module", "undocumented-public-function"]
"tests/__init__.py" = ["undocumented-public-package"]
"artistools/misc/test_misc.py" = ["suspicious-subprocess-import"]
"artistools/test_artistools.py" = ["suspicious-subprocess-import"]
"set_version.py" = ["suspicious-subprocess-import", "start-process-with-partial-path"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"artistools" = "at"
"matplotlib" = "mpl"
"matplotlib.axes" = "mplax"
"matplotlib.figure" = "mplfig"
"matplotlib.pyplot" = "plt"
"matplotlib.typing" = "mplt"
"numpy.typing" = "npt"
"polars" = "pl"
"polars.selectors" = "cs"
"polars.testing" = "pltest"
"pynonthermal" = "pynt"
"typing" = "t"

[tool.ruff.lint.flake8-import-conventions]
# the code reads these modules through their aliases, e.g. `t.Any`
banned-from = ["matplotlib.pyplot", "numpy", "typing"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
require-lazy = "all"
# the CLI must start quickly, thus the function that uses one of these dependencies imports it
banned-module-level-imports = ["argcomplete", "imageio", "plotly", "pynonthermal", "pyvista"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"bz2.open".msg = "Use at.zopen or polars_source, which select the decompression from the file extension"
"concurrent.futures.ProcessPoolExecutor".msg = "Use parallel_map, which selects threads or processes"
"gzip.open".msg = "Use at.zopen or polars_source, which select the decompression from the file extension"
"lzma.open".msg = "Use at.zopen or polars_source, which select the decompression from the file extension"
"multiprocessing.Pool".msg = "Use parallel_map, which selects threads or processes"
"pandas".msg = "Use polars. artistools has no pandas dependency"

[tool.ruff.lint.flake8-type-checking]
# imports used only in annotations belong in a `if t.TYPE_CHECKING:` block, which keeps them out
# of the CLI startup path for the same reason `import-outside-top-level` is allowed
strict = true

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false

[tool.ty.rules]
unresolved-import = "ignore"
# these rules are off by default
blanket-ignore-comment = "error"
disjoint-cast = "error"
dynamic-function-decorator-return = "error"
invalid-legacy-positional-parameter = "error"
invalid-mutable-override = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
unsupported-dynamic-base = "error"

[tool.ty.src]
exclude = [".venv/**"]

[tool.vulture]
exclude = [".*", "build/", ".eggs/", ".venv", "venv"]
paths = ["artistools"]
sort_by_size = true
ignore_names = [
    # reached by name from subcommandtree in commands.py, so there is no textual call site
    "get_artistools_path",
    "show_version",
    # NamedTuple field
    "ion_pot",
    # run by the CodSpeed benchmark fixture rather than called directly
    "run_dimension_reduce",
    # attributes set on pyvista plotters and matplotlib axis objects
    "camera_position",
    "azimuth",
    "elevation",
    "locator",
    "formatter",
    # methods that Qt, argparse, or pickle call on a subclass
    "textFromValue",
    "expandingDirections",
    "hasHeightForWidth",
    "dragEnterEvent",
    "dropEvent",
    "paintEvent",
    "_check_value",
    "find_class",
    # keys of the TypedDict SubplotSettings, which the code reads with a string
    "ylim",
    "exponentlabel",
    "cliplogbottom",
    # names that only a quoted annotation uses. Python 3.13 evaluates an annotation with no quotes at import time
    "FigureCanvasBase",
    "mpllegendhandler",
    # the value that a mock returns, which a test sets
    "return_value",
]
