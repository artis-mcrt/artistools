[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "artistools"
authors = [
    { name = "Luke J. Shingles", email = "luke.shingles@gmail.com" },
    { name = "Christine E. Collins", email = "c.collins@gsi.de" },
    { name = "Alexander Holas", email = "alexander.holas@h-its.org" },
    { name = "Fionntan Callan", email = "fcallan02@qub.ac.uk" },
    { name = "Stuart Sim", email = "s.sim@qub.ac.uk" },
    { name = "Joshua Pollin", email = "jpollin02@qub.ac.uk" },
    { name = "Gerrit Leck", email = "g.leck@gsi.de" },
]
description = "Plotting and analysis tools for the ARTIS 3D radiative transfer code for supernovae and kilonovae."
keywords = [
    "artis",
    "astronomy",
    "astrophysics",
    "kilonova",
    "monte-carlo",
    "radiative-transfer",
    "supernova",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
version = "2026.8.21"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICEN[CS]E*"]
readme = { file = "README.md", content-type = 'text/markdown' }
dependencies = [
    "argcomplete>=3.7.2",
    "extinction>=0.4.9",
    "matplotlib>=3.10.8",
    "numpy>=2.5.2",
    "polars>=1.43.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tqdm>=4.70.0",
    "zstandard>=0.25.0;python_version<'3.14'",
]

[project.optional-dependencies]
# adding a package here also needs an entry in `ignore-missing-imports` under [tool.pyrefly]
extras = [
    "george>=0.4.4;python_version<'3.15'", # not compatible with 3.15 yet
    "imageio>=2.37.4",
    "plotly>=6.9.0",
    "pypdf>=6.16.2",
    "pynonthermal>=2026.8.9",
    "pyvista>=0.48.4;python_version<'3.15'", # not compatible with 3.15 yet
]

[dependency-groups]
dev = [
    "imageio>=2.37.4",
    "prek>=0.4.14",
    "pynonthermal>=2026.8.9",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-codspeed>=5.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist[psutil]>=3.8.0",
    "refurb>=2.3.1",
    "ruff>=0.16.4,<0.17",
    "ty>=0.0.74",
    "types-pyyaml>=6.0.12.20260408",
    "types-tqdm>=4.67.3.20260408",
    "vulture>=2.14",
]

[project.urls]
Repository = "https://github.com/artis-mcrt/artistools"
Issues = "https://github.com/artis-mcrt/artistools/issues"

[project.scripts]
at = 'artistools.__main__:main'
artistools = 'artistools.__main__:main'
makeartismodel1dslicefromcone = 'artistools.inputmodel.slice1dfromconein3dmodel:main'
makeartismodel = 'artistools.inputmodel.makeartismodel:main'
plotartisdensity = 'artistools.inputmodel.plotdensity:main'
plotartisestimators = 'artistools.estimators.plotestimators:main'
plotartislightcurve = 'artistools.lightcurve.plotlightcurve:main'
plotartislinefluxes = 'artistools.linefluxes:main'
plotartismacroatom = 'artistools.macroatom:main'
plotartisnltepops = 'artistools.nltepops.plotnltepops:main'
plotartisnonthermal = 'artistools.nonthermal:main'
plotartisradfield = 'artistools.radfield:main'
plotartisspectrum = 'artistools.spectra.plotspectra:main'
plotartistransitions = 'artistools.transitions:main'
plotartisinitialcomposition = 'artistools.inputmodel.plotinitialcomposition:main'
plotartisviewingangles = 'artistools.viewing_angles_visualization:main'

[tool.cibuildwheel]
build-frontend = "uv"
archs = ["auto64"]
# check_wheel.py gives the reason why this is not a full run of the command-line interface
test-command = "python {project}/check_wheel.py"
# cibuildwheel installs the wheel together with its dependencies, and polars has no free-threaded
# wheel. The test install thus compiles polars from source, and the compiler runs out of memory on
# the aarch64 runner. deploypypi.yml checks the free-threaded wheels on the host instead, with an
# install that skips the dependencies
test-skip = "cp3*t-*"

[tool.cibuildwheel.linux]
before-all = [
    "mkdir -p /host/home/runner/work/artistools/artistools/rust/target",
    "mkdir -p /project/rust/target",
    "rm -rf /project/rust/target",
    "ln -s -f /host/home/runner/work/artistools/artistools/rust/target /project/rust/",
    "curl -sSf https://sh.rustup.rs | sh -s -- -y",
]
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
before-all = [
    "rustup update stable",
]

[tool.coverage.run]
# --cov=./ also measured conftest.py, set_version.py and tests/__init__.py. Test modules are
# ~100% covered by definition, so counting them inflated the project figure; dropping them is a
# one-off baseline reset of about 4.5 points, not a regression.
source = ["artistools"]
omit = ["*/test_*.py", "*/conftest.py"]

[tool.maturin]
bindings = "pyo3"
profile = "release"
manifest-path = "rust/Cargo.toml"
module-name = "artistools.rustext"
use-base-python = true
include = [
    "artistools/data/**",
    "artistools/**/artistoolscompletions.sh",
    "artistools/**/matplotlibrc",
]
exclude = [
    { path = "**/test_*.py", format = "wheel" },
    { path = "set_version.py", format = "sdist" },
    { path = "check_wheel.py", format = "sdist" },
]

[tool.pyrefly]
preset = "strict"
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/venv/**",
    "**/.[!/.]*/**",
    '**/build/**',
    '**/dist/**',
    '**/target/**',
    '**/.venv/**',
]
python-interpreter-path = ".venv/bin/python3"
# missing-import is left enabled so a renamed or mistyped first-party module is an error (no other
# checker catches that: pyright downgrades it to information).
# The [project.optional-dependencies] packages are absent from a plain `uv sync`, and zstandard is
# not installed on 3.14+, so those resolve to Any rather than erroring.
ignore-missing-imports = [
    "george",
    "george.*",
    "imageio.*",
    "plotly.*",
    "pynonthermal",
    "pypdf",
    "pyvista",
    "zstandard",
]

[tool.pyrefly.errors]
unbound-name = false
implicit-any-empty-container = true
implicit-any-lambda = true
no-any-return-implicit = true
string-as-iterable = true
unnecessary-type-conversion = true
unsupported-operation = true

[tool.pyright]
venvPath = "."
venv = ".venv"
enableTypeIgnoreComments = false # leave these for the other type checkers to interpret
exclude = [
    '**/node_modules',
    '**/__pycache__',
    '**/.*',
    'build',
    'dist',
    'target',
    '.venv',
]
reportAny = false
reportCallInDefaultInitializer = "error"
reportConstantRedefinition = false # uppercase physics variables (Z, W, T_R) are reassignable by convention
reportExplicitAny = false
reportImplicitOverride = "error"
reportImplicitStringConcatenation = false
reportImportCycles = false
reportMatchNotExhaustive = "error"
reportMissingImports = "information"
reportMissingTypeStubs = false
reportPossiblyUnboundVariable = false
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnnecessaryComparison = "information"
reportUnreachable = false
reportUnusedCallResult = false
reportUnusedParameter = false
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
pythonVersion = "3.13"

[tool.pytest]
minversion = "9.0"
addopts = [
    "--durations=0",
    "--durations-min=1.0",
    "-n",
    "auto",
]
testpaths = ["artistools"]

[tool.refurb]
# FURB152 rewrites numeric literals as math constants, which misfires on comparison tolerances
# that happen to sit near pi, tau or e. FURB184 inlines single-use variables, which .sourcery.yaml
# already turns off as inline-variable for the same readability reason.
ignore = ["FURB120", "FURB152", "FURB184"]
quiet = false
enable_all = true
python_version = "3.13"
sort_by = "error"

# `x == []` is an intentional exact-equality assertion in these tests: `not x` would also pass
# if the function under test regressed to returning None
[[tool.refurb.amend]]
path = "./artistools/test_artistools.py"
ignore = ["FURB115"]

[[tool.refurb.amend]]
path = "./artistools/misc/test_misc.py"
ignore = ["FURB115"]

[tool.ruff]
line-length = 120
fix = true
preview = true

[tool.ruff.format]
skip-magic-trailing-comma = true
preview = true
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "any-type",
    "complex-structure",
    "missing-trailing-comma",
    "missing-copyright-notice",
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "docstring-missing-returns",
    "docstring-missing-yields",
    "docstring-missing-exception",
    "line-too-long",
    "commented-out-code",
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "line-contains-todo",
    "invalid-function-name",
    "invalid-argument-name",
    "non-lowercase-variable-in-function",
    "import-outside-top-level",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-nested-blocks",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-arguments",
    "too-many-statements",
    "magic-value-comparison",
    "float-equality-comparison",
    "assert",
    "print",
    "missing-todo-author",
    "missing-todo-link",
]
unfixable = [
    "commented-out-code", # (will just delete it!)
    "unused-import",      # (can be annoying to have import disappear while editing)
    "unused-variable",
    "expr-or-true",
    "expr-and-false",
]

[tool.ruff.lint.per-file-ignores]
# Test names describe the case already; a docstring restating them is noise.
"**/test_*.py" = [
    "undocumented-public-module",
    "undocumented-public-class",
    "undocumented-public-function",
]
"**/conftest.py" = ["undocumented-public-module", "undocumented-public-function"]
"tests/__init__.py" = ["undocumented-public-package"]
"artistools/commands.py" = ["suspicious-subprocess-import", "start-process-with-partial-path"]
"artistools/misc/test_misc.py" = ["suspicious-subprocess-import"]
"artistools/test_artistools.py" = ["suspicious-subprocess-import"]
"set_version.py" = ["suspicious-subprocess-import", "start-process-with-partial-path"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"artistools" = "at"
"matplotlib" = "mpl"
"matplotlib.axes" = "mplax"
"matplotlib.figure" = "mplfig"
"matplotlib.pyplot" = "plt"
"matplotlib.typing" = "mplt"
"numpy.typing" = "npt"
"polars" = "pl"
"polars.selectors" = "cs"
"polars.testing" = "pltest"
"pynonthermal" = "pynt"
"typing" = "t"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
require-lazy = "all"

[tool.ruff.lint.flake8-type-checking]
# imports used only in annotations belong in a `if t.TYPE_CHECKING:` block, which keeps them out
# of the CLI startup path for the same reason `import-outside-top-level` is allowed
strict = true

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false

[tool.ruff.lint.pydocstyle]
# Resolves the D203/D211 and D212/D213 conflicts that selecting the whole D group creates, and
# leaves Args/Returns/Raises sections optional.
convention = "pep257"

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ty.src]
exclude = [".venv/**"]

[tool.vulture]
exclude = [".*", "build/", ".eggs/", ".venv", "venv"]
paths = ["artistools"]
sort_by_size = true
ignore_names = [
    # reached by name from subcommandtree in commands.py, so there is no textual call site
    "get_artistools_path",
    "setup_completions",
    "show_version",
    # NamedTuple field
    "ion_pot",
    # run by the CodSpeed benchmark fixture rather than called directly
    "run_dimension_reduce",
    # attributes set on pyvista plotters and matplotlib axis objects
    "camera_position",
    "azimuth",
    "elevation",
    "locator",
    "formatter",
]
