[package]
name = "artistools"
version = "2026.10.21"
authors = ["Luke Shingles <luke.shingles@gmail.com>"]
edition = "2024"
rust-version = "1.95.1"
description = "Rust functions used to speed up the artistools python package"
license = "MIT"
homepage = "https://github.com/artis-mcrt/artistools"
repository = "https://github.com/artis-mcrt/artistools"
readme = "../README.md"

[lib]
name = "rustext"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
autocompress = { version = "0.6.0", features = ["gzip", "rayon", "xz", "zstd"] }
polars = { version = "0.55.2", features = ["diagonal_concat", "performant"] }
# abi3-py313 gives one extension for each GIL-enabled Python from 3.13. abi3t-py315 gives one extension
# for the free-threaded and the GIL-enabled Python from 3.15 (PEP 803). A free-threaded Python before
# 3.15 has no stable ABI, thus artistools supports a free-threaded Python only from 3.15
pyo3 = { version = "0.29.1", features = ["abi3-py313", "abi3t-py315"] }
pyo3-polars = { version = "0.28.0" }
rayon = "1.10"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lints.rust]
# each function uses only the safe API of PyO3 and polars. Thus a new unsafe block needs a change here and a review
unsafe_code = "forbid"

[profile.dev]
opt-level = 3

[profile.release]
# the default strip of a release is "debuginfo", which gives a mis-aligned LINKEDIT string pool on macOS
strip = "none"
