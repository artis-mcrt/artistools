[package]
name = "artistools"
version = "2026.7.18"
authors = ["Luke Shingles <luke.shingles@gmail.com>"]
edition = "2024"
rust-version = "1.95.1"
description = "Rust functions used to speed up the artistools python package"
license = "MIT"
homepage = "https://github.com/artis-mcrt/artistools"
repository = "https://github.com/artis-mcrt/artistools"
readme = "../README.md"

[lib]
name = "rustext"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
autocompress = { version = "0.6.0", features = ["gzip", "rayon", "xz", "zstd"] }
polars = { version = "0.55.1", features = ["diagonal_concat", "performant"] }
pyo3 = { version = "0.29.1", features = ["abi3-py313"] }
pyo3-polars = { version = "0.28.0" }
rayon = "1.10"

[profile.dev]
opt-level = 3
debug = "full"
#lto = "thin"
strip = "none"

[profile.release]
#codegen-units = 1
debug = "none"
opt-level = 3
overflow-checks = false
#lto = "fat"
#fixes mis-aligned LINKEDIT string pool error on macos
strip = "none"
