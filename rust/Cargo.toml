[package]
name = "artistools"
version = "2026.7.18"
authors = ["Luke Shingles <luke.shingles@gmail.com>"]
edition = "2024"
rust-version = "1.97.1"
description = "Rust functions used to speed up the artistools python package"
license = "MIT"
homepage = "https://github.com/artis-mcrt/artistools"
repository = "https://github.com/artis-mcrt/artistools"
readme = "../README.md"

[lib]
name = "rustext"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
autocompress = { version = "0.6.0", features = ["gzip", "rayon", "xz", "zstd"] }
polars = { version = "0.54.4", features = ["diagonal_concat", "performant"] }
pyo3 = { version = "0.28.2", features = ["abi3-py313"] }
pyo3-polars = { version = "0.27.0" }
rayon = "1.10"

[profile.dev]
opt-level = 3
debug = "full"
#lto = "thin"

[profile.release]
#codegen-units = 1
debug = "none"
opt-level = 3
overflow-checks = false
#lto = "fat"
# Skip cargo's default debuginfo strip: llvm-objcopy before rustc 1.97.1 misaligns the Mach-O
# LINKEDIT string pool, and macOS 26+ dyld then refuses to load the extension module
# (rust-lang/rust#157750). Removable once rustc >= 1.97.1 can be assumed everywhere.
strip = "none"
