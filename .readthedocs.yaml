---
# The configuration of the documentation build on readthedocs.org.
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
    os: ubuntu-26.04
    tools:
        python: '3.14'
        # maturin compiles artistools.rustext, and rust/Cargo.toml requires Rust 1.95.1 or later
        rust: latest
    jobs:
        pre_create_environment:
            - asdf plugin add uv
            - asdf install uv latest
            - asdf global uv latest
        create_environment:
            - uv venv --python 3.14 "${READTHEDOCS_VIRTUALENV_PATH}"
        # An optimised compile of polars took more than the limit of 900 s for a build. The site needs only the help text.
        install:
            - CARGO_PROFILE_RELEASE_OPT_LEVEL=0 CARGO_PROFILE_RELEASE_CODEGEN_UNITS=256 UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync
              --frozen --python 3.14 --no-default-groups --group docs

sphinx:
    configuration: docs/conf.py
    fail_on_warning: true
